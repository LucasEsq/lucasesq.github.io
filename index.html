<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habits & Todos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --fg: #1a1a1a;
      --border: #d4cfc4;
      --accent: #8b5a3c;
      --hover: #6d4730;
      --surface: #ffffff;
      --muted: #6b6b6b;
      --success: #4a7c59;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      --bg: #0f0f0f;
      --fg: #e8e8e8;
      --border: #2a2a2a;
      --accent: #d4a574;
      --hover: #e8c299;
      --surface: #1a1a1a;
      --muted: #9a9a9a;
      --success: #7cb88f;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Crimson Pro', serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    h1, h2, h3 {
      font-weight: 300;
      letter-spacing: -0.02em;
    }

    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    h2 { font-size: 1.8rem; margin-bottom: 1rem; }
    h3 { font-size: 1.3rem; margin-bottom: 0.75rem; }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }

    /* Login Page */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .login-title {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.875rem 2rem;
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
      font-weight: 600;
    }

    .btn:hover {
      background: var(--hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .error-message {
      color: #c44;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    /* Navigation */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    /* Items List */
    .items-grid {
      display: grid;
      gap: 1rem;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .item-card:hover {
      border-color: var(--accent);
    }

    .item-info h3 {
      margin-bottom: 0.25rem;
    }

    .item-description {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .item-actions {
      display: flex;
      gap: 0.75rem;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .add-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 2rem;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .add-btn:hover {
      background: var(--hover);
      transform: scale(1.05);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
    }

    .close-btn:hover {
      color: var(--fg);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-group .btn {
      width: auto;
      flex: 1;
    }

    /* Calendar */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .calendar-header {
      text-align: center;
      padding: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .calendar-day {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      padding: 0.5rem;
    }

    .calendar-day:hover {
      border-color: var(--accent);
    }

    .calendar-day.selected {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .calendar-day.other-month {
      opacity: 0.3;
    }

    .day-number {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .day-indicator {
      font-size: 0.7rem;
      color: var(--success);
    }

    /* Day View */
    .day-view {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
      margin-top: 2rem;
    }

    .day-view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }

    .toggle-item:hover {
      background: var(--bg);
    }

    .toggle-item:last-child {
      border-bottom: none;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox.checked {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox.checked::after {
      content: '✓';
      color: white;
      font-weight: bold;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
    }

    .stat-value {
      font-size: 3rem;
      font-weight: 600;
      color: var(--accent);
      margin: 0.5rem 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .progress-bar {
      height: 8px;
      background: var(--border);
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    .day-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .day-btn {
      padding: 0.5rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Crimson Pro', serif;
    }

    .day-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .day-btn:hover {
      border-color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============================================
    // CONFIG - Replace with your Supabase details
    // ============================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================
    // ENCRYPTION UTILITIES
    // ============================================
    class EncryptionService {
      async deriveKey(password, salt) {
        const encoder = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          encoder.encode(password),
          'PBKDF2',
          false,
          ['deriveBits', 'deriveKey']
        );

        return crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      async encrypt(text, password) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await this.deriveKey(password, salt);
        
        const encoder = new TextEncoder();
        const encrypted = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          encoder.encode(text)
        );

        const result = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
        result.set(salt, 0);
        result.set(iv, salt.length);
        result.set(new Uint8Array(encrypted), salt.length + iv.length);

        return btoa(String.fromCharCode(...result));
      }

      async decrypt(encryptedData, password) {
        try {
          const data = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
          const salt = data.slice(0, 16);
          const iv = data.slice(16, 28);
          const encrypted = data.slice(28);

          const key = await this.deriveKey(password, salt);
          const decrypted = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: iv },
            key,
            encrypted
          );

          const decoder = new TextDecoder();
          return decoder.decode(decrypted);
        } catch (e) {
          console.error('Decryption failed:', e);
          return null;
        }
      }
    }

    const encryption = new EncryptionService();

    // ============================================
    // APP COMPONENT
    // ============================================
    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [encryptionKey, setEncryptionKey] = useState(null);
      const [theme, setTheme] = useState('light');

      useEffect(() => {
        // Check system preference
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light');
        setTheme(savedTheme);
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Check auth state
        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const toggleTheme = () => {
        const newTheme = theme === 'light' ? 'dark' : 'light';
        setTheme(newTheme);
        localStorage.setItem('theme', newTheme);
        document.documentElement.setAttribute('data-theme', newTheme);
      };

      const handleLogin = async (password) => {
        setEncryptionKey(password);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setEncryptionKey(null);
        setUser(null);
      };

      if (loading) {
        return <div className="container"><div className="loading">Loading...</div></div>;
      }

      if (!user) {
        return <LoginPage onLogin={handleLogin} />;
      }

      if (!encryptionKey) {
        return <LoginPage onLogin={handleLogin} user={user} />;
      }

      return (
        <MainApp 
          user={user} 
          encryptionKey={encryptionKey} 
          onLogout={handleLogout}
          theme={theme}
          toggleTheme={toggleTheme}
        />
      );
    }

    // ============================================
    // LOGIN PAGE
    // ============================================
    function LoginPage({ onLogin, user }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          if (!user) {
            const { error } = await supabase.auth.signInWithPassword({
              email,
              password
            });

            if (error) throw error;
          }
          
          onLogin(password);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-container">
          <div className="login-box">
            <h1 className="login-title">Habits & Todos</h1>
            <form onSubmit={handleSubmit}>
              {!user && (
                <div className="form-group">
                  <label>Email</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required
                  />
                </div>
              )}
              <div className="form-group">
                <label>Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>
              {error && <div className="error-message">{error}</div>}
              <button type="submit" className="btn" disabled={loading}>
                {loading ? 'Loading...' : 'Login'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ============================================
    // MAIN APP
    // ============================================
    function MainApp({ user, encryptionKey, onLogout, theme, toggleTheme }) {
      const [page, setPage] = useState('habits');
      const [habits, setHabits] = useState([]);
      const [todos, setTodos] = useState([]);
      const [completions, setCompletions] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          // Load habits
          const { data: habitsData } = await supabase
            .from('habits')
            .select('*')
            .eq('user_id', user.id);

          // Load todos
          const { data: todosData } = await supabase
            .from('todos')
            .select('*')
            .eq('user_id', user.id);

          // Load completions
          const { data: completionsData } = await supabase
            .from('completions')
            .select('*')
            .eq('user_id', user.id);

          // Decrypt data
          const decryptedHabits = await Promise.all(
            (habitsData || []).map(async (h) => ({
              ...h,
              title: await encryption.decrypt(h.title, encryptionKey),
              description: h.description ? await encryption.decrypt(h.description, encryptionKey) : ''
            }))
          );

          const decryptedTodos = await Promise.all(
            (todosData || []).map(async (t) => ({
              ...t,
              title: await encryption.decrypt(t.title, encryptionKey),
              description: t.description ? await encryption.decrypt(t.description, encryptionKey) : ''
            }))
          );

          setHabits(decryptedHabits.filter(h => h.title));
          setTodos(decryptedTodos.filter(t => t.title));
          setCompletions(completionsData || []);
        } catch (err) {
          console.error('Error loading data:', err);
        } finally {
          setLoading(false);
        }
      };

      const addHabit = async (title, description) => {
        const encryptedTitle = await encryption.encrypt(title, encryptionKey);
        const encryptedDescription = description ? await encryption.encrypt(description, encryptionKey) : null;

        const { data, error } = await supabase
          .from('habits')
          .insert([{
            user_id: user.id,
            title: encryptedTitle,
            description: encryptedDescription
          }])
          .select();

        if (!error && data) {
          setHabits([...habits, { ...data[0], title, description }]);
        }
      };

      const deleteHabit = async (id) => {
        await supabase.from('habits').delete().eq('id', id);
        setHabits(habits.filter(h => h.id !== id));
      };

      const addTodo = async (title, description) => {
        const encryptedTitle = await encryption.encrypt(title, encryptionKey);
        const encryptedDescription = description ? await encryption.encrypt(description, encryptionKey) : null;

        const { data, error } = await supabase
          .from('todos')
          .insert([{
            user_id: user.id,
            title: encryptedTitle,
            description: encryptedDescription
          }])
          .select();

        if (!error && data) {
          setTodos([...todos, { ...data[0], title, description }]);
        }
      };

      const deleteTodo = async (id) => {
        await supabase.from('todos').delete().eq('id', id);
        setTodos(todos.filter(t => t.id !== id));
      };

      const toggleCompletion = async (itemId, itemType, date) => {
        const dateStr = date.toISOString().split('T')[0];
        const existing = completions.find(
          c => c.item_id === itemId && c.item_type === itemType && c.date === dateStr
        );

        if (existing) {
          await supabase.from('completions').delete().eq('id', existing.id);
          setCompletions(completions.filter(c => c.id !== existing.id));
        } else {
          const { data } = await supabase
            .from('completions')
            .insert([{
              user_id: user.id,
              item_id: itemId,
              item_type: itemType,
              date: dateStr
            }])
            .select();

          if (data) {
            setCompletions([...completions, data[0]]);
          }
        }
      };

      if (loading) {
        return <div className="container"><div className="loading">Loading your data...</div></div>;
      }

      return (
        <div className="container">
          <header className="header">
            <h1>Habits & Todos</h1>
            <nav className="nav">
              <a 
                className={`nav-link ${page === 'habits' ? 'active' : ''}`}
                onClick={() => setPage('habits')}
              >
                Habits
              </a>
              <a 
                className={`nav-link ${page === 'todos' ? 'active' : ''}`}
                onClick={() => setPage('todos')}
              >
                Todos
              </a>
              <a 
                className={`nav-link ${page === 'calendar' ? 'active' : ''}`}
                onClick={() => setPage('calendar')}
              >
                Calendar
              </a>
              <a 
                className={`nav-link ${page === 'stats' ? 'active' : ''}`}
                onClick={() => setPage('stats')}
              >
                Stats
              </a>
              <button className="theme-toggle" onClick={toggleTheme}>
                {theme === 'light' ? '🌙' : '☀️'}
              </button>
              <a className="nav-link" onClick={onLogout}>Logout</a>
            </nav>
          </header>

          {page === 'habits' && (
            <HabitsPage 
              habits={habits} 
              onAdd={addHabit} 
              onDelete={deleteHabit}
            />
          )}

          {page === 'todos' && (
            <TodosPage 
              todos={todos} 
              onAdd={addTodo} 
              onDelete={deleteTodo}
            />
          )}

          {page === 'calendar' && (
            <CalendarPage 
              habits={habits}
              todos={todos}
              completions={completions}
              onToggle={toggleCompletion}
            />
          )}

          {page === 'stats' && (
            <StatsPage 
              habits={habits}
              todos={todos}
              completions={completions}
            />
          )}
        </div>
      );
    }

    // ============================================
    // HABITS PAGE
    // ============================================
    function HabitsPage({ habits, onAdd, onDelete }) {
      const [showModal, setShowModal] = useState(false);

      return (
        <>
          <div className="items-grid">
            {habits.length === 0 && (
              <div className="empty-state">
                No habits yet. Click the + button to create your first habit.
              </div>
            )}
            {habits.map(habit => (
              <div key={habit.id} className="item-card">
                <div className="item-info">
                  <h3>{habit.title}</h3>
                  {habit.description && (
                    <p className="item-description">{habit.description}</p>
                  )}
                </div>
                <div className="item-actions">
                  <button 
                    className="icon-btn" 
                    onClick={() => onDelete(habit.id)}
                    title="Delete"
                  >
                    🗑
                  </button>
                </div>
              </div>
            ))}
          </div>

          <button className="add-btn" onClick={() => setShowModal(true)}>
            +
          </button>

          {showModal && (
            <HabitModal 
              onClose={() => setShowModal(false)} 
              onSave={onAdd}
            />
          )}
        </>
      );
    }

    function HabitModal({ onClose, onSave }) {
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(title, description);
        onClose();
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>New Habit</h2>
              <button className="close-btn" onClick={onClose}>×</button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Title *</label>
                <input
                  type="text"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  required
                  autoFocus
                />
              </div>
              <div className="form-group">
                <label>Description (optional)</label>
                <textarea
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                />
              </div>
              <div className="btn-group">
                <button type="button" className="btn btn-secondary" onClick={onClose}>
                  Cancel
                </button>
                <button type="submit" className="btn">
                  Create
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================
    // TODOS PAGE
    // ============================================
    function TodosPage({ todos, onAdd, onDelete }) {
      const [showModal, setShowModal] = useState(false);

      return (
        <>
          <div className="items-grid">
            {todos.length === 0 && (
              <div className="empty-state">
                No todos yet. Click the + button to create your first todo.
              </div>
            )}
            {todos.map(todo => (
              <div key={todo.id} className="item-card">
                <div className="item-info">
                  <h3>{todo.title}</h3>
                  {todo.description && (
                    <p className="item-description">{todo.description}</p>
                  )}
                </div>
                <div className="item-actions">
                  <button 
                    className="icon-btn" 
                    onClick={() => onDelete(todo.id)}
                    title="Delete"
                  >
                    🗑
                  </button>
                </div>
              </div>
            ))}
          </div>

          <button className="add-btn" onClick={() => setShowModal(true)}>
            +
          </button>

          {showModal && (
            <TodoModal 
              onClose={() => setShowModal(false)} 
              onSave={onAdd}
            />
          )}
        </>
      );
    }

    function TodoModal({ onClose, onSave }) {
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(title, description);
        onClose();
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>New Todo</h2>
              <button className="close-btn" onClick={onClose}>×</button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Title *</label>
                <input
                  type="text"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  required
                  autoFocus
                />
              </div>
              <div className="form-group">
                <label>Description (optional)</label>
                <textarea
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                />
              </div>
              <div className="btn-group">
                <button type="button" className="btn btn-secondary" onClick={onClose}>
                  Cancel
                </button>
                <button type="submit" className="btn">
                  Create
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================
    // CALENDAR PAGE
    // ============================================
    function CalendarPage({ habits, todos, completions, onToggle }) {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDate, setSelectedDate] = useState(new Date());

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDayOfWeek = firstDay.getDay();

        const days = [];
        
        // Previous month days
        const prevMonthLastDay = new Date(year, month, 0).getDate();
        for (let i = startingDayOfWeek - 1; i >= 0; i--) {
          days.push({
            date: new Date(year, month - 1, prevMonthLastDay - i),
            isCurrentMonth: false
          });
        }

        // Current month days
        for (let i = 1; i <= daysInMonth; i++) {
          days.push({
            date: new Date(year, month, i),
            isCurrentMonth: true
          });
        }

        // Next month days
        const remainingDays = 42 - days.length;
        for (let i = 1; i <= remainingDays; i++) {
          days.push({
            date: new Date(year, month + 1, i),
            isCurrentMonth: false
          });
        }

        return days;
      };

      const days = getDaysInMonth(currentDate);
      const monthYear = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const getCompletedCount = (date) => {
        const dateStr = date.toISOString().split('T')[0];
        return completions.filter(c => c.date === dateStr).length;
      };

      const isSelected = (date) => {
        return date.toDateString() === selectedDate.toDateString();
      };

      return (
        <>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem' }}>
            <h2>{monthYear}</h2>
            <div style={{ display: 'flex', gap: '0.5rem' }}>
              <button 
                className="icon-btn" 
                onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1))}
              >
                ←
              </button>
              <button 
                className="icon-btn" 
                onClick={() => setCurrentDate(new Date())}
              >
                Today
              </button>
              <button 
                className="icon-btn" 
                onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1))}
              >
                →
              </button>
            </div>
          </div>

          <div className="calendar">
            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
              <div key={day} className="calendar-header">{day}</div>
            ))}
            {days.map((day, idx) => {
              const completed = getCompletedCount(day.date);
              const total = habits.length + todos.length;
              return (
                <div
                  key={idx}
                  className={`calendar-day ${!day.isCurrentMonth ? 'other-month' : ''} ${isSelected(day.date) ? 'selected' : ''}`}
                  onClick={() => setSelectedDate(day.date)}
                >
                  <div className="day-number">{day.date.getDate()}</div>
                  {completed > 0 && (
                    <div className="day-indicator">{completed}/{total}</div>
                  )}
                </div>
              );
            })}
          </div>

          <DayView 
            date={selectedDate}
            habits={habits}
            todos={todos}
            completions={completions}
            onToggle={onToggle}
          />
        </>
      );
    }

    function DayView({ date, habits, todos, completions, onToggle }) {
      const dateStr = date.toISOString().split('T')[0];
      const dateDisplay = date.toLocaleDateString('en-US', { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });

      const isCompleted = (itemId, itemType) => {
        return completions.some(
          c => c.item_id === itemId && c.item_type === itemType && c.date === dateStr
        );
      };

      return (
        <div className="day-view">
          <div className="day-view-header">
            <h3>{dateDisplay}</h3>
          </div>

          {habits.length > 0 && (
            <>
              <h3 style={{ marginTop: '1.5rem', marginBottom: '1rem', fontSize: '1.1rem', color: 'var(--muted)' }}>
                Habits
              </h3>
              {habits.map(habit => (
                <div key={habit.id} className="toggle-item">
                  <div>
                    <div style={{ fontWeight: '500' }}>{habit.title}</div>
                    {habit.description && (
                      <div style={{ fontSize: '0.9rem', color: 'var(--muted)', marginTop: '0.25rem' }}>
                        {habit.description}
                      </div>
                    )}
                  </div>
                  <div 
                    className={`checkbox ${isCompleted(habit.id, 'habit') ? 'checked' : ''}`}
                    onClick={() => onToggle(habit.id, 'habit', date)}
                  />
                </div>
              ))}
            </>
          )}

          {todos.length > 0 && (
            <>
              <h3 style={{ marginTop: '1.5rem', marginBottom: '1rem', fontSize: '1.1rem', color: 'var(--muted)' }}>
                Todos
              </h3>
              {todos.map(todo => (
                <div key={todo.id} className="toggle-item">
                  <div>
                    <div style={{ fontWeight: '500' }}>{todo.title}</div>
                    {todo.description && (
                      <div style={{ fontSize: '0.9rem', color: 'var(--muted)', marginTop: '0.25rem' }}>
                        {todo.description}
                      </div>
                    )}
                  </div>
                  <div 
                    className={`checkbox ${isCompleted(todo.id, 'todo') ? 'checked' : ''}`}
                    onClick={() => onToggle(todo.id, 'todo', date)}
                  />
                </div>
              ))}
            </>
          )}

          {habits.length === 0 && todos.length === 0 && (
            <div className="empty-state">
              Create some habits or todos to track them here.
            </div>
          )}
        </div>
      );
    }

    // ============================================
    // STATS PAGE
    // ============================================
    function StatsPage({ habits, todos, completions }) {
      const [days, setDays] = useState(7);

      const getHabitStats = (habitId, numDays) => {
        const dates = [];
        for (let i = 0; i < numDays; i++) {
          const date = new Date();
          date.setDate(date.getDate() - i);
          dates.push(date.toISOString().split('T')[0]);
        }

        const completed = dates.filter(date =>
          completions.some(c => c.item_id === habitId && c.item_type === 'habit' && c.date === date)
        ).length;

        return Math.round((completed / numDays) * 100);
      };

      const getTodoCompletionsByDay = () => {
        const byDay = {};
        completions
          .filter(c => c.item_type === 'todo')
          .forEach(c => {
            if (!byDay[c.date]) byDay[c.date] = 0;
            byDay[c.date]++;
          });

        return Object.entries(byDay)
          .sort((a, b) => b[0].localeCompare(a[0]))
          .slice(0, 30);
      };

      const todosByDay = getTodoCompletionsByDay();

      return (
        <>
          <div className="day-selector">
            {[7, 14, 30].map(d => (
              <button
                key={d}
                className={`day-btn ${days === d ? 'active' : ''}`}
                onClick={() => setDays(d)}
              >
                {d} days
              </button>
            ))}
          </div>

          <h2>Habit Completion Rates</h2>
          <div className="stats-grid">
            {habits.length === 0 && (
              <div className="empty-state">No habits to show stats for.</div>
            )}
            {habits.map(habit => {
              const percentage = getHabitStats(habit.id, days);
              return (
                <div key={habit.id} className="stat-card">
                  <h3>{habit.title}</h3>
                  <div className="stat-value">{percentage}%</div>
                  <div className="stat-label">completed in last {days} days</div>
                  <div className="progress-bar">
                    <div className="progress-fill" style={{ width: `${percentage}%` }} />
                  </div>
                </div>
              );
            })}
          </div>

          <h2 style={{ marginTop: '3rem' }}>Todo Completions</h2>
          <div className="stats-grid">
            {todosByDay.length === 0 && (
              <div className="empty-state">No completed todos yet.</div>
            )}
            {todosByDay.slice(0, 10).map(([date, count]) => (
              <div key={date} className="stat-card">
                <div className="stat-label">
                  {new Date(date + 'T00:00:00').toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric'
                  })}
                </div>
                <div className="stat-value">{count}</div>
                <div className="stat-label">todos completed</div>
              </div>
            ))}
          </div>
        </>
      );
    }

    // ============================================
    // RENDER
    // ============================================
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
